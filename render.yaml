services:
  - type: web
    name: cll15-paper
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT --timeout 300 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    disk:
      name: paper-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
